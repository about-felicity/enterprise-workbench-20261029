[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-source-card-collectors"
version = "0.6.0"
description = "Standalone Baidu AI card, Wenxin card and DeepSeek source collectors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31,<3",
  "scrapling[fetchers]>=0.4.14,<0.5",
  "websocket-client>=1.7,<2",
]

[project.scripts]
geo-source-cards = "geo_source_cards.cli:main"
geo-source-analyze = "geo_source_cards.source_analysis:main"
geo-session-watch = "geo_source_cards.session_watch:main"
geo-editorial = "geo_source_cards.editorial_pipeline:main"
geo-writer-watch = "geo_source_cards.writer_handoff:main"
geo-staged-editorial = "geo_source_cards.staged_editorial:main"
geo-daily-editorial = "geo_source_cards.daily_editorial:main"
geo-archive-sync = "geo_source_cards.archive_sync:main"
geo-api-worker = "geo_source_cards.api_worker:main"
geo-desktop = "geo_source_cards.desktop_app:main"

[project.optional-dependencies]
writing = ["python-docx>=1.1,<2"]
bridge = ["paramiko>=3,<5", "python-docx>=1.1,<2"]
desktop = ["PySide6>=6.8,<7", "paramiko>=3,<5", "python-docx>=1.1,<2"]

[tool.setuptools.packages.find]
include = ["geo_source_cards*", "wenxin_monitor*", "web_collectors*", "monitor_core*"]

