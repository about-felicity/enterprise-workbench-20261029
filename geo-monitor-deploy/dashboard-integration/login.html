<!doctype html>
<html lang="zh-CN" data-workbench="login">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>员工登录 · 企业工作台</title>
  <style>
    {theme}

    :root {
      color-scheme: light;
      --bg-top: #f5faff;
      --bg-middle: #dce9f8;
      --bg-bottom: #c8ddf5;
      --card: #fff;
      --ink: #0b1b33;
      --muted: #50617b;
      --line: #c9daee;
      --field: #f3f7fd;
      --accent: var(--wb-blue);
      --button-start: #2362c4;
      --button-end: #2875ca;
      --toggle: #ffffffa6;
      --shadow: #143c785c;
      --error-bg: #fff1f2;
      --error-ink: #a21b39;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg-top: #172842;
        --bg-middle: #0d1829;
        --bg-bottom: #08111f;
        --card: #14233a;
        --ink: #eaf2ff;
        --muted: #b0c2db;
        --line: #385274;
        --field: #0f1c30;
        --accent: #8dbfff;
        --toggle: #162842c7;
        --shadow: #0009;
        --error-bg: #3c2030;
        --error-ink: #ffc2cc;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg-top: #172842;
      --bg-middle: #0d1829;
      --bg-bottom: #08111f;
      --card: #14233a;
      --ink: #eaf2ff;
      --muted: #b0c2db;
      --line: #385274;
      --field: #0f1c30;
      --accent: #8dbfff;
      --toggle: #162842c7;
      --shadow: #0009;
      --error-bg: #3c2030;
      --error-ink: #ffc2cc;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      color: var(--ink);
      background: radial-gradient(ellipse at 50% 35%, var(--bg-top), var(--bg-middle) 62%, var(--bg-bottom));
      font-family: Inter, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    main { display: grid; justify-items: center; gap: 16px; width: min(100%, 400px); }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .09em;
      color: var(--muted);
    }
    .brand-mark {
      display: grid;
      width: 26px;
      height: 26px;
      place-items: center;
      border-radius: 7px;
      background: var(--wb-blue);
      color: #fff;
    }
    .brand-mark svg { width: 18px; height: 18px; }
    .stage { width: 100%; perspective: 1200px; }
    .card {
      --mx: 50%;
      --my: 50%;
      --rx: 0deg;
      --ry: 0deg;
      --scale: 1;
      --holo: .16;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      box-shadow: 0 30px 60px -22px var(--shadow), 0 4px 14px #143c7824;
      transform: rotateX(var(--rx)) rotateY(var(--ry)) scale(var(--scale));
      transition: transform 150ms ease;
    }
    .sky {
      position: relative;
      min-height: 146px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 22px 24px 35px;
      color: #fff;
      background:
        radial-gradient(circle at 82% 18%, #fff6 0, #fff0 38%),
        radial-gradient(ellipse at 12% 116%, #7cc0f5 0, #7cc0f500 65%),
        linear-gradient(160deg, #245fbf, #3888dc 62%, #83c1f2);
    }
    .sky::after {
      content: "";
      position: absolute;
      inset: auto 0 -1px;
      height: 27px;
      background: linear-gradient(transparent, var(--card));
    }
    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(28px, 7vw, 34px);
      font-weight: 650;
      line-height: 1.12;
      letter-spacing: -.035em;
      text-shadow: 0 2px 12px #12376555;
    }

    form {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 14px;
      padding: 8px 24px 24px;
    }
    .field { display: grid; gap: 6px; }
    label { color: var(--muted); font-size: 13px; font-weight: 600; }
    .input-wrap { position: relative; }
    .field input {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      color: var(--ink);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 11px;
      font: inherit;
      font-size: 16px;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input::placeholder { color: var(--muted); opacity: .88; }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 23%, transparent);
    }
    .input-wrap:has(.eye:not([hidden])) input { padding-inline-end: 62px; }
    .eye {
      position: absolute;
      inset-inline-end: 4px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 44px;
      min-height: 36px;
      padding: 6px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .go {
      min-height: 44px;
      padding: 10px 14px;
      color: #fff;
      border: 0;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--button-start), var(--button-end));
      box-shadow: 0 8px 18px -8px var(--button-start);
      font: inherit;
      font-size: 15px;
      font-weight: 650;
      cursor: pointer;
      transition: transform .15s, filter .15s;
    }
    .go:hover { filter: brightness(1.08); }
    .go:active { transform: scale(.985); }
    .error {
      padding: 8px 10px;
      border-radius: 9px;
      color: var(--error-ink);
      background: var(--error-bg);
      font-size: 13px;
      line-height: 1.5;
    }
    .login-message:empty { display: none; }
    .eye:hover, .theme:hover { color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

    .foil, .glare { position: absolute; inset: 0; pointer-events: none; }
    .foil {
      opacity: calc(var(--holo) * .58);
      background-image: linear-gradient(#5a5a5a, #5a5a5a),
        repeating-linear-gradient(125deg, #99f5ff 0%, #a3ffd1 5%, #d9b5ff 10%, #ffaee7 15%, #fff3a3 20%, #99f5ff 25%),
        var(--shards, none);
      background-blend-mode: screen, difference, normal;
      background-size: auto, 300% 300%, 170px 170px;
      background-position: 0 0, var(--mx) var(--my), 0 0;
      mask-image: radial-gradient(farthest-corner circle at var(--mx) var(--my), #000, #0005 52%, transparent);
    }
    .glare {
      opacity: var(--holo);
      background: radial-gradient(farthest-corner circle at var(--mx) var(--my), #fff4 0%, #fff1 28%, transparent 62%);
    }
    .theme {
      min-height: 36px;
      padding: 5px 12px;
      color: var(--muted);
      background: var(--toggle);
      border: 1px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    @media (max-width: 360px) {
      .sky { min-height: 126px; padding-inline: 20px; }
      form { padding-inline: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card { transform: none; }
      .card, .field input, .go { transition: none; }
      .go:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="brand-mark">{logo}</span>企业工作台</div>
    <div class="stage" id="stage">
      <section class="card" id="card" aria-labelledby="login-title">
        <header class="sky"><h1 id="login-title">欢迎回来</h1></header>
        <form method="post" action="/geo_monitor/login">
          <input type="hidden" name="next" value="{next}">
          <div class="login-message" role="alert">{error}</div>
          <div class="field">
            <label for="username">员工账号</label>
            <input id="username" name="username" autocomplete="username" autocapitalize="none"
              spellcheck="false" maxlength="64" placeholder="请输入员工账号" required>
          </div>
          <div class="field">
            <label for="password">密码</label>
            <div class="input-wrap">
              <input id="password" name="password" type="password" autocomplete="current-password"
                maxlength="128" placeholder="请输入密码" required>
              <button class="eye" id="password-toggle" type="button" aria-controls="password" hidden>显示</button>
            </div>
          </div>
          <button class="go" type="submit">登录工作台</button>
        </form>
        <span class="foil" aria-hidden="true"></span>
        <span class="glare" aria-hidden="true"></span>
      </section>
    </div>
    <button class="theme" id="theme-toggle" type="button" hidden></button>
  </main>
  <script>
    const password = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    passwordToggle.hidden = false;
    passwordToggle.addEventListener('click', () => {
      const show = password.type === 'password';
      password.type = show ? 'text' : 'password';
      passwordToggle.textContent = show ? '隐藏' : '显示';
    });

    const root = document.documentElement;
    const themeToggle = document.getElementById('theme-toggle');
    const prefersDark = matchMedia('(prefers-color-scheme: dark)');
    const themeKey = 'workbench-login-theme';
    try {
      const saved = localStorage.getItem(themeKey);
      if (saved === 'dark' || saved === 'light') root.dataset.theme = saved;
    } catch {}
    const currentTheme = () => root.dataset.theme || (prefersDark.matches ? 'dark' : 'light');
    function updateThemeLabel() {
      themeToggle.textContent = currentTheme() === 'dark' ? '切换浅色' : '切换深色';
    }
    themeToggle.addEventListener('click', () => {
      const theme = currentTheme() === 'dark' ? 'light' : 'dark';
      root.dataset.theme = theme;
      try { localStorage.setItem(themeKey, theme); } catch {}
      updateThemeLabel();
    });
    prefersDark.addEventListener('change', updateThemeLabel);
    updateThemeLabel();
    themeToggle.hidden = false;

    const stage = document.getElementById('stage');
    const card = document.getElementById('card');
    const motion = matchMedia('(hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference)');
    const clamp = value => Math.max(0, Math.min(1, value));
    let frame = 0;
    let textureReady = false;

    function paintTexture() {
      const size = 128;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const context = canvas.getContext('2d');
      if (!context) return;

      let seed = 7;
      const random = () => ((seed = seed * 16807 % 2147483647) / 2147483647);
      const cells = Array.from({ length: 48 }, (_, index) => {
        const row = Math.floor(index / 6);
        const x = (index % 6 + (row % 2) / 2 + random()) * size / 6;
        const y = (row + random()) * size / 8;
        return { x: x % size, y, gray: 70 + random() * 150 };
      });
      const pixels = context.createImageData(size, size);
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          let first = Infinity;
          let second = Infinity;
          let gray = 0;
          for (const cell of cells) {
            const dx = Math.abs(cell.x - x);
            const dy = Math.abs(cell.y - y);
            const distance = Math.hypot(Math.min(dx, size - dx), Math.min(dy, size - dy));
            if (distance < first) {
              second = first;
              first = distance;
              gray = cell.gray;
            } else if (distance < second) {
              second = distance;
            }
          }
          const pixel = (y * size + x) * 4;
          const shade = second - first < .8 ? 250 : gray;
          pixels.data[pixel] = pixels.data[pixel + 1] = pixels.data[pixel + 2] = shade;
          pixels.data[pixel + 3] = 255;
        }
      }
      context.putImageData(pixels, 0, 0);
      card.style.setProperty('--shards', 'url(' + canvas.toDataURL('image/png') + ')');
    }

    function resetTilt() {
      cancelAnimationFrame(frame);
      frame = 0;
      for (const property of ['--mx', '--my', '--rx', '--ry', '--scale', '--holo']) {
        card.style.removeProperty(property);
      }
    }

    stage.addEventListener('pointermove', event => {
      if (!motion.matches || event.pointerType !== 'mouse') return;
      if (!textureReady) {
        textureReady = true;
        paintTexture();
      }
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const rect = stage.getBoundingClientRect();
        const x = clamp((event.clientX - rect.left) / rect.width);
        const y = clamp((event.clientY - rect.top) / rect.height);
        card.style.setProperty('--mx', x * 100 + '%');
        card.style.setProperty('--my', y * 100 + '%');
        card.style.setProperty('--rx', (.5 - y) * 14 + 'deg');
        card.style.setProperty('--ry', (x - .5) * 14 + 'deg');
        card.style.setProperty('--scale', '1.015');
        card.style.setProperty('--holo', '1');
      });
    });
    stage.addEventListener('pointerleave', resetTilt);
    stage.addEventListener('pointercancel', resetTilt);
    motion.addEventListener('change', resetTilt);
  </script>
</body>
</html>
