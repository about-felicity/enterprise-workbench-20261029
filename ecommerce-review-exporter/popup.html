<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>评论导出助手</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <div class="brand">
        <div class="logo">评</div>
        <div>
          <h1>评论导出助手</h1>
          <p>淘宝 / 天猫 / 京东</p>
        </div>
      </div>
      <button id="openPanel" type="button">打开页面抓取面板</button>
      <p id="message" class="message">请先打开商品详情页。</p>
      <div class="tips">
        <strong>使用提示</strong>
        <ol>
          <li>保持商品详情页处于登录状态</li>
          <li>打开面板并填写最大抓取条数</li>
          <li>抓取完成后点击“导出 Excel”</li>
        </ol>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
