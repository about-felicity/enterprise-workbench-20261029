        # BEGIN GEO_DEEPSEEK_PUBLIC_INGEST
        location ^~ /geo_monitor/collector/deepseek/ {
            auth_request off;
            client_max_body_size 5m;
            limit_req zone=geo_deepseek_upload burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:18811/;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 5s;
            proxy_read_timeout 25s;
            proxy_send_timeout 25s;
            proxy_next_upstream off;
            proxy_cache off;
            proxy_no_cache 1;
            access_log /var/log/nginx/geo_monitor_access.log main;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        # END GEO_DEEPSEEK_PUBLIC_INGEST

