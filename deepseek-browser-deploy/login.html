<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeepSeek 无头浏览器插件测试 · 登录</title>
<style>body{font:15px system-ui;margin:20px auto;max-width:1100px;background:#f3f7f5;color:#173f36}h1{font-size:23px}p{line-height:1.7}#screen{width:100%;background:white;border:1px solid #b9d5c9;border-radius:12px;touch-action:manipulation}input,button{font:inherit;padding:10px;border:1px solid #aac8bc;border-radius:7px;margin:4px}input{width:min(65%,600px)}#status{padding:12px;background:#e1eee8;border-radius:8px}small{color:#54736a}</style>
<h1>DeepSeek · 无头浏览器＋插件测试</h1><p>以下是服务器上真实 Chromium 的页面。点击画面中的输入框后，可直接用键盘输入（支持中文、粘贴和快捷键）。也可用下方输入框发送文字。<b>此测试不会在登录后自动提问。</b></p>
<p id="status">连接浏览器中…</p><img id="screen" tabindex="0" alt="服务器无头浏览器画面"><textarea id="capture" aria-label="远端键盘输入" autocomplete="off" autocapitalize="off" spellcheck="false" style="position:fixed;left:-10000px;top:0;width:1px;height:1px;opacity:0"></textarea><small id="inputState">点击画面后可直接输入</small><div><input id="text" type="password" autocomplete="off" placeholder="手机号 / 验证码 / 密码"><button id="send">输入到页面</button><label><input type="checkbox" id="show" style="width:auto">显示输入</label></div><div><button data-key="Backspace">退格</button><button data-key="Tab">切换输入框</button><button data-key="Enter">回车</button><button data-key="Control+A">全选</button><button data-key="Escape">关闭弹窗</button></div><small>输入响应失败时，请先查看画面确认是否已经输入，不要连续重试。此入口通过本机SSH隧道连接，登录保存在独立浏览器用户目录。</small>
<script>
const screen=document.querySelector('#screen'),status=document.querySelector('#status'),capture=document.querySelector('#capture'),inputState=document.querySelector('#inputState');
const proxied=location.pathname.endsWith('/ui'),apiBase=proxied?location.pathname.slice(0,-2):'/';let csrf='';const api=p=>apiBase+(proxied&&p==='status'?'state':p);
const queue=[];let sending=false,halted=false,compose=false,drainTimer=0,frameBusy=false,urgent=false,activeUntil=0;
function enqueue(value){
 if(halted){inputState.textContent='输入响应未确认：请先查看画面，刷新此控制页后再操作';return Promise.resolve(false)}
 return new Promise(resolve=>{const tail=queue[queue.length-1];if(value.type==='text'&&tail?.value.type==='text'){tail.value.text+=value.text;tail.done.push(resolve)}else queue.push({value,done:[resolve]});
 clearTimeout(drainTimer);if(value.type==='text')drainTimer=setTimeout(drain,35);else drain();});
}
async function drain(){if(sending||halted)return;sending=true;try{while(queue.length){
 const item=queue.shift();inputState.textContent='正在输入…';const started=performance.now();let ok=false;
 try{if(proxied&&!csrf){const auth=await fetch(api('status'));const v=await auth.json();csrf=v.csrf||'';if(!csrf)throw new Error('control_session_not_ready')}const r=await fetch(api('input'),{method:'POST',headers:{'Content-Type':'application/json',...(proxied?{'X-CSRF-Token':csrf,'X-Action-Id':Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,'0')).join('')}:{})},body:JSON.stringify(item.value),signal:AbortSignal.timeout(12000)});ok=r.ok}catch(e){}
 if(!ok){halted=true;inputState.textContent='输入响应未确认，请先看画面；不会自动重复输入';item.done.forEach(f=>f(false));queue.splice(0).forEach(x=>x.done.forEach(f=>f(false)));break}
 inputState.textContent='输入已确认 · '+Math.round(performance.now()-started)+' 毫秒';item.done.forEach(f=>f(true));activeUntil=Date.now()+1800;urgent=true;frame();
 }}finally{sending=false}}
function textInput(){if(compose||!capture.value)return;const text=capture.value;capture.value='';enqueue({type:'text',text})}
capture.addEventListener('compositionstart',()=>compose=true);capture.addEventListener('compositionend',()=>{compose=false;textInput()});capture.addEventListener('input',textInput);
capture.addEventListener('keydown',e=>{if(e.isComposing||compose)return;const key=(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'?'Control+A':e.key;if(['Enter','Tab','Backspace','Delete','Escape','ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Control+A'].includes(key)){e.preventDefault();textInput();enqueue({type:'key',key})}});
screen.onpointerdown=e=>{e.preventDefault();capture.focus({preventScroll:true});const b=screen.getBoundingClientRect();enqueue({type:'click',x:Math.max(0,Math.min(1099,(e.clientX-b.left)*1100/b.width)),y:Math.max(0,Math.min(779,(e.clientY-b.top)*780/b.height))})};
screen.onwheel=e=>{e.preventDefault();enqueue({type:'scroll',delta:Math.max(-800,Math.min(800,e.deltaY))})};
document.querySelector('#send').onclick=async()=>{const t=document.querySelector('#text');if(!t.value)return;const value=t.value;if(await enqueue({type:'text',text:value})){if(t.value===value)t.value=''}};
document.querySelector('#text').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();document.querySelector('#send').click()}};
document.querySelector('#show').onchange=e=>document.querySelector('#text').type=e.target.checked?'text':'password';
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>enqueue({type:'key',key:b.dataset.key}));
let frameTimer=0;
async function frame(){if(frameBusy)return;clearTimeout(frameTimer);frameBusy=true;urgent=false;
 try{const r=await fetch(api('frame')+'?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(10000)});if(r.ok){const u=URL.createObjectURL(await r.blob());const old=screen.src;await new Promise(resolve=>{screen.onload=resolve;screen.onerror=resolve;screen.src=u});if(old.startsWith('blob:'))URL.revokeObjectURL(old)}}catch(e){}
 finally{frameBusy=false;frameTimer=setTimeout(frame,urgent?0:Date.now()<activeUntil?80:400)}}
async function state(){try{const r=await fetch(api('status'),{signal:AbortSignal.timeout(10000)});const s=await r.json();if(s.csrf)csrf=s.csrf;status.textContent=s.message||'无头浏览器启动中…'}catch(e){}setTimeout(state,5000)}frame();state();
</script></html>
