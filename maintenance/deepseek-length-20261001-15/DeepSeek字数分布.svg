<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="#f7fafc"/><g font-family="Microsoft YaHei,sans-serif" fill="#213c4a"><text x="40" y="42" font-size="26" font-weight="700">DeepSeek：剔除国外站点后的文章字数</text><text x="40" y="72" font-size="14">2026年10月1—15日 · 1,018篇有效文章 · 图中比例为文章分布，并非推荐概率</text><text x="40" y="132" font-size="16">不足1000</text><rect x="190" y="111" width="353.6" height="30" fill="#177e86" rx="4"/><text x="558.6" y="132" font-size="15">180篇 · 17.7%</text><text x="40" y="185" font-size="16">1000–1999</text><rect x="190" y="164" width="489.2" height="30" fill="#177e86" rx="4"/><text x="694.2" y="185" font-size="15">249篇 · 24.5%</text><text x="40" y="238" font-size="16">2000–2999</text><rect x="190" y="217" width="491.2" height="30" fill="#177e86" rx="4"/><text x="696.2" y="238" font-size="15">250篇 · 24.6%</text><text x="40" y="291" font-size="16">3000–4999</text><rect x="190" y="270" width="373.3" height="30" fill="#177e86" rx="4"/><text x="578.3" y="291" font-size="15">190篇 · 18.7%</text><text x="40" y="344" font-size="16">5000–7999</text><rect x="190" y="323" width="188.6" height="30" fill="#177e86" rx="4"/><text x="393.6" y="344" font-size="15">96篇 · 9.4%</text><text x="40" y="397" font-size="16">8000及以上</text><rect x="190" y="376" width="104.1" height="30" fill="#177e86" rx="4"/><text x="309.1" y="397" font-size="15">53篇 · 5.2%</text><text x="40" y="466" font-size="16">字数中位数：2,513；仅大陆样本：852篇，中位数2,396</text><text x="40" y="496" font-size="13" fill="#607482">正文汉字、字母和数字字符；已剔除明显商品页、百科、问答等，以及低质量/缺失正文。</text></g></svg>